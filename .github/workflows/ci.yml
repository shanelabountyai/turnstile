name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # addendum §2: off = the owner role (as every clone runs today); enforce = app_rw, NOBYPASSRLS. RLS is opt-in (D-23;
        # owner decision 2026-11-05): a clone runs the enforce leg once it sets the repo variable RLS_ENFORCE=1. The template always runs both.
        rls: ${{ fromJSON((github.repository == 'shanelabountyai/saas-foundation' || vars.RLS_ENFORCE == '1') && '["off","enforce"]' || '["off"]') }}
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turnstile_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/turnstile_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:7700
      TZ: America/Chicago # the runner itself, not just Postgres (D-9: nothing in the engine may depend on it)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb turnstile_test
      - run: npx prisma migrate deploy
      - name: RLS enforce leg — app role, system URL
        if: matrix.rls == 'enforce'
        run: |
          psql -d turnstile_test -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_rw' NOBYPASSRLS NOSUPERUSER;"
          psql -d turnstile_test -c "GRANT USAGE ON SCHEMA public TO app_rw; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_rw; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_rw;"
          echo "RLS_MODE=enforce" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYSTEM=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://app_rw:app_rw@localhost:5432/turnstile_test?connection_limit=8&pool_timeout=20" >> "$GITHUB_ENV"
      - run: npx vitest run
      # Phase 1 gate (docs/phase-1-tasks.md 1.14): the pure engine, the oracle agreement, the frozen fixtures.
      # fixtures:check runs AFTER inventory:eval so a product-code write into fixtures/ fails the run (task 1.2).
      # No Stripe secret is configured here and none is needed (D-5).
      - run: npm run inventory:lint
      - run: npm run inventory:eval
      - run: npm run fixtures:check
      # Phase 2 gate (docs/phase-2-tasks.md 2.7). The concurrency (cast) and signature (webhook) tests ran in vitest above.
      # Off leg only: eval:db TRUNCATEs as the owner role, and the migrations-vs-schema diff needs only one run.
      - name: prisma migrate diff (migrations = schema)
        if: matrix.rls == 'off'
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turnstile_shadow
        run: |
          createdb turnstile_shadow
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema --exit-code
      - name: inventory:eval:db (2,662 commands through the cast path, Stripe recorded; no Stripe secret)
        if: matrix.rls == 'off'
        run: npx tsx scripts/inventory-eval-db.ts
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
